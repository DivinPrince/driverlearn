<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b7dc1" />
    <meta name="description" content="Learn every question of the Rwanda provisional driving licence theory test — practice, mock exams, road signs and progress tracking." />
    <title>DriverLearn — Rwanda driving test prep</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const s = JSON.parse(localStorage.getItem('driverlearn:settings') || '{}')
        const dark = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
